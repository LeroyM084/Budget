<li data-id="{{ enveloppe.id }}">
  <a class="carte" href="{{ url_for('voir_enveloppe', id=enveloppe.id) }}">
    <span class="icone">
      {%- if enveloppe.type == "physique" %}
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2.5" y="6" width="19" height="12" rx="2"/>
        <circle cx="12" cy="12" r="2.75"/>
        <path d="M6 9v.01M18 15v.01"/>
      </svg>
      {%- else %}
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2.5" y="5" width="19" height="14" rx="2"/>
        <path d="M2.5 9.5h19M6 15h3"/>
      </svg>
      {%- endif %}
    </span>
    <span class="nom">{{ enveloppe.nom }}</span>
    <span class="montant{% if enveloppe.solde < 0 %} negatif{% endif %}">{{ enveloppe.solde|euros }}</span>
  </a>
  <span class="poignee" aria-hidden="true" title="Glisser pour déplacer">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
  </span>
</li>
