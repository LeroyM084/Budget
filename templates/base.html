<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  {# Pas de cache d'historique (soldes toujours frais, rien dans le navigateur) ;
     les réponses 422 (erreurs de validation) sont affichées. #}
  <meta name="htmx-config" content='{
    "historyCacheSize": 0,
    "responseHandling": [
      {"code": "204", "swap": false},
      {"code": "[23]..", "swap": true},
      {"code": "422", "swap": true, "error": true},
      {"code": "[45]..", "swap": false, "error": true}
    ]
  }'>
  <title>{% block titre %}Enveloppes{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{ url_for('static', filename='icones/icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icones/icon-192.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='htmx.min.js') }}" defer></script>
  <script>
    // Modales : ouverture (sens présélectionné, focus sur le premier champ),
    // fermeture au clic sur le fond et après un enregistrement réussi.
    // Sans JavaScript, la classe « js » manque et les formulaires restent dans la page.
    document.documentElement.classList.add("js");

    document.addEventListener("click", (evenement) => {
      const lien = evenement.target.closest("[data-modale]");
      if (lien) {
        evenement.preventDefault();
        const modale = document.getElementById(lien.dataset.modale);
        if (lien.dataset.sens) {
          modale.querySelector(`[name="sens"][value="${lien.dataset.sens}"]`).checked = true;
        }
        modale.showModal();
        modale.querySelector("input:not([type=radio])").focus();
      } else if (evenement.target.localName === "dialog") {
        evenement.target.close();
      }
    });

    // Glisser-déposer des enveloppes par leur poignée, à l'intérieur de leur section
    // (une liste .cartes par type) ; le nouvel ordre est enregistré au lâcher.
    document.addEventListener("pointerdown", (evenement) => {
      const poignee = evenement.target.closest(".poignee");
      if (!poignee) return;
      evenement.preventDefault();
      const carte = poignee.closest("li");
      const liste = carte.parentElement;
      carte.classList.add("deplacee");
      const deplacer = (e) => {
        const voisine = [...liste.children].find((li) => {
          const r = li.getBoundingClientRect();
          return li !== carte && e.clientY > r.top && e.clientY < r.bottom;
        });
        if (voisine) {
          const avant = e.clientY < voisine.getBoundingClientRect().top + voisine.offsetHeight / 2;
          liste.insertBefore(carte, avant ? voisine : voisine.nextSibling);
        }
      };
      const lacher = () => {
        carte.classList.remove("deplacee");
        document.removeEventListener("pointermove", deplacer);
        document.removeEventListener("pointerup", lacher);
        document.removeEventListener("pointercancel", lacher);
        const donnees = new URLSearchParams([...liste.children].map((li) => ["id", li.dataset.id]));
        fetch("/enveloppes/ordre", { method: "POST", body: donnees });
      };
      // Écoute sur le document : la carte change de place dans le DOM pendant le geste.
      document.addEventListener("pointermove", deplacer);
      document.addEventListener("pointerup", lacher);
      document.addEventListener("pointercancel", lacher);
    });

    document.addEventListener("htmx:afterRequest", (evenement) => {
      if (evenement.detail.successful) {
        evenement.target.closest("dialog")?.close();
      }
    });
  </script>
</head>
<body hx-boost="true" hx-disabled-elt="find button">
  <header class="entete">
    <a href="{{ url_for('accueil') }}" class="marque">{% block marque %}Enveloppes{% endblock %}</a>
    {% if g.utilisateur %}
    <form method="post" action="{{ url_for('deconnexion') }}" hx-boost="false">
      <button class="discret">Déconnexion</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block contenu %}{% endblock %}
  </main>
</body>
</html>
